# Alembic設定(app_*テーブル専用。正本schema.sql由来のテーブルは管理対象外)
# URL未指定時は app.core.config.settings.database_url を使用(env.py参照)
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
